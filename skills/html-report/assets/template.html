<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0C0E" media="(prefers-color-scheme: dark)">
<title>{{TITLE}}</title>
<style>
/* ============================================================
   FUELED BRAND TOKENS + component kit.
   Edit this file to rebrand every report at once.
   Base CSS is always emitted. Optional component blocks are wrapped in
   build markers and dropped by scripts/build.py when their class is
   absent from the body fragment.
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --fueled-black:#000000;--fueled-white:#F5F5F1;--fueled-nebula:#6652FF;
  --fueled-tech-grey:#EAEAEA;--fueled-cryo:#00A6FF;--fueled-solar:#FF52B7;--fueled-nova:#FBBC09;
  --brand-font-display:"Aeonik","Host Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --brand-font-body:"Aeonik","Host Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --brand-font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --brand-radius:8px;--brand-radius-sm:4px;--brand-radius-pill:100px;
  --brand-maxw:1080px;--brand-gap:18px;
}

/* LIGHT (default surface). Verdict follows the theme: a light card on light. */
:root,[data-theme="light"]{
  color-scheme:light;
  --brand-paper:#F5F5F1;--brand-card:#FFFFFF;--brand-line:#EAEAEA;--brand-line-strong:#D8D8D3;
  --brand-ink:#000000;--brand-ink-soft:#45454A;--brand-muted:#8A8A85;
  --brand-accent:#6652FF;--brand-accent-2:#00A6FF;--brand-accent-tint:#EEEBFF;
  --ok:#2F7A4F;--ok-ink:#215838;--ok-bg:#E4F1EA;
  --warn:#FBBC09;--warn-ink:#7A5C05;--warn-bg:#FDF1D0;
  --bad:#B23A38;--bad-ink:#8F2C2A;--bad-bg:#F9E1E0;
  --verdict-bg:#FFFFFF;--verdict-fg:#000000;--verdict-muted:#8A8A85;--verdict-border:#EAEAEA;
  --track:#EDEDE9;
}

/* DARK. Verdict follows the theme: a dark card on dark. */
[data-theme="dark"]{
  color-scheme:dark;
  --brand-paper:#0C0C0E;--brand-card:#161618;--brand-line:#26262A;--brand-line-strong:#34343A;
  --brand-ink:#F5F5F1;--brand-ink-soft:#B7B7BD;--brand-muted:#87878E;
  --brand-accent:#8C7DFF;--brand-accent-2:#3FB8FF;--brand-accent-tint:#211E3D;
  --ok:#57C98A;--ok-ink:#57C98A;--ok-bg:#122A1D;
  --warn:#F2C230;--warn-ink:#F2C230;--warn-bg:#312712;
  --bad:#F1706D;--bad-ink:#F1706D;--bad-bg:#371A19;
  --verdict-bg:#161618;--verdict-fg:#F5F5F1;--verdict-muted:#9C9DA8;--verdict-border:#26262A;
  --track:#26262A;
}

/* AUTO follows the OS. Default theme is Auto. */
@media (prefers-color-scheme: dark){
  [data-theme="auto"]{
    color-scheme:dark;
    --brand-paper:#0C0C0E;--brand-card:#161618;--brand-line:#26262A;--brand-line-strong:#34343A;
    --brand-ink:#F5F5F1;--brand-ink-soft:#B7B7BD;--brand-muted:#87878E;
    --brand-accent:#8C7DFF;--brand-accent-2:#3FB8FF;--brand-accent-tint:#211E3D;
    --ok:#57C98A;--ok-ink:#57C98A;--ok-bg:#122A1D;
    --warn:#F2C230;--warn-ink:#F2C230;--warn-bg:#312712;
    --bad:#F1706D;--bad-ink:#F1706D;--bad-bg:#371A19;
    --verdict-bg:#161618;--verdict-fg:#F5F5F1;--verdict-muted:#9C9DA8;--verdict-border:#26262A;
    --track:#26262A;
  }
}

*{box-sizing:border-box}
html{color-scheme:light dark;background:var(--brand-paper);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--brand-paper);color:var(--brand-ink);font-family:var(--brand-font-body);font-weight:400;font-size:19px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .2s ease,color .2s ease}
.page{background:var(--brand-paper);min-height:100vh}
.wrap{max-width:var(--brand-maxw);margin:0 auto;padding:0 28px}
a{color:var(--brand-accent);text-underline-offset:2px}

.eyebrow{font-family:var(--brand-font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-muted);font-weight:500}

header{border-bottom:1px solid var(--brand-line);background:var(--brand-paper)}
.masthead{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0}
.brandlogo{height:28px;width:auto;display:block;color:var(--brand-ink)}
h1.title{font-family:var(--brand-font-display);font-weight:500;letter-spacing:-.02em;line-height:1.06;font-size:clamp(34px,5vw,56px);margin:14px 0 0}
.thesis{font-size:clamp(19px,2.3vw,23px);color:var(--brand-ink-soft);max-width:60ch;margin:18px 0 0;line-height:1.45}

section{padding:44px 0;border-top:1px solid var(--brand-line)}
h2{font-family:var(--brand-font-display);font-weight:500;letter-spacing:-.02em;font-size:clamp(23px,3vw,31px);line-height:1.14;margin:0}
h3{font-family:var(--brand-font-display);font-weight:500;letter-spacing:-.01em;font-size:19px;margin:26px 0 0}
.lede{font-size:19px;color:var(--brand-ink-soft);margin:12px 0 0;line-height:1.5}
ul{padding-left:20px}li{margin:7px 0}
.src-line{font-family:var(--brand-font-mono);font-size:12px;color:var(--brand-muted);margin-top:12px}

.theme-toggle{display:inline-flex;background:var(--brand-card);border:1px solid var(--brand-line-strong);border-radius:var(--brand-radius-pill);padding:3px;flex:none}
.theme-toggle button{font-family:var(--brand-font-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;border:0;background:transparent;color:var(--brand-ink-soft);padding:6px 12px;border-radius:var(--brand-radius-pill);cursor:pointer;transition:background .15s ease,color .15s ease}
.theme-toggle button[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand-paper)}
.theme-toggle button:focus-visible{outline:2px solid var(--brand-accent);outline-offset:2px}

footer{border-top:1px solid var(--brand-line);padding:28px 0 56px;font-family:var(--brand-font-mono);font-size:12.5px;color:var(--brand-muted)}

/* @c:tag */
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--brand-font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;padding:4px 9px;border-radius:var(--brand-radius-pill);color:var(--brand-accent);background:var(--brand-accent-tint)}
/* @/c */

/* @c:verdict */
.verdict{background:var(--verdict-bg);color:var(--verdict-fg);border:1px solid var(--verdict-border);border-top:3px solid var(--brand-accent);border-radius:calc(var(--brand-radius) + 4px);padding:30px 34px}
.verdict .eyebrow{color:var(--verdict-muted)}
.verdict h2{color:var(--verdict-fg);margin:12px 0 0}
.verdict p{color:var(--verdict-fg);opacity:.82;max-width:66ch;margin:14px 0 0;line-height:1.55}
/* @/c */

/* @c:pill */
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--brand-font-mono);font-size:11px;font-weight:500;padding:3px 9px;border-radius:var(--brand-radius-pill)}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink)}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.pill.bad{background:var(--bad-bg);color:var(--bad-ink)}
/* @/c */

/* @c:data */
table.data{width:100%;border-collapse:collapse;background:var(--brand-card);border:1px solid var(--brand-line);border-radius:var(--brand-radius);overflow:hidden;font-family:var(--brand-font-display);font-size:15px;margin-top:16px}
table.data th{text-align:left;font-weight:500;padding:13px 18px;background:var(--brand-accent-tint);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--brand-ink)}
table.data td{padding:13px 18px;border-top:1px solid var(--brand-line);color:var(--brand-ink-soft);vertical-align:top}
table.data td strong{color:var(--brand-ink);font-weight:600}
/* @/c */

/* @c:finding */
.finding{border-left:3px solid var(--ok);background:var(--brand-card);border:1px solid var(--brand-line);border-radius:var(--brand-radius-sm);padding:16px 20px;margin-top:12px}
.finding.hypothesis{border-left-color:var(--warn)}
.finding .kind{font-family:var(--brand-font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ok-ink)}
.finding.hypothesis .kind{color:var(--warn-ink)}
.finding p{margin:8px 0 0;font-size:16px;line-height:1.5}
.finding .cite{font-family:var(--brand-font-mono);font-size:12px;color:var(--brand-muted);margin-top:8px}
/* @/c */

/* @c:card,grid2 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.card{background:var(--brand-card);border:1px solid var(--brand-line);border-radius:var(--brand-radius);padding:20px 22px}
.card h3{margin:0}
.card p{font-size:16px;color:var(--brand-ink-soft);margin:10px 0 0;line-height:1.5}
/* @/c */

/* @c:track,weights,fill */
.weights{margin-top:18px;display:grid;gap:10px;max-width:520px}
.weightrow{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:12px}
.weightrow .lbl{font-family:var(--brand-font-mono);font-size:12px;color:var(--brand-ink-soft)}
.track{height:24px;background:var(--track);border-radius:5px;overflow:hidden}
.fill{height:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-family:var(--brand-font-mono);font-size:11px;background:var(--brand-accent)}
/* @/c */

/* @c:diff */
.diff{font-family:var(--brand-font-mono);font-size:13px;background:var(--brand-card);border:1px solid var(--brand-line);border-radius:var(--brand-radius);overflow:hidden;margin-top:16px}
.diff .row{display:grid;grid-template-columns:1fr 320px;border-top:1px solid var(--brand-line)}
.diff .code{padding:6px 14px;white-space:pre-wrap}
.diff .code.add{background:var(--ok-bg)}
.diff .code.del{background:var(--bad-bg)}
.diff .note{padding:8px 14px;border-left:1px solid var(--brand-line);font-family:var(--brand-font-body);font-size:14px;color:var(--brand-ink-soft)}
/* @/c */

/* @c:export */
.export{font-family:var(--brand-font-mono);font-size:13px;border:0;background:var(--brand-ink);color:var(--brand-paper);padding:10px 18px;border-radius:var(--brand-radius-pill);cursor:pointer}
.export:focus-visible{outline:2px solid var(--brand-accent);outline-offset:2px}
/* @/c */

/* @c:sources */
.sources{font-family:var(--brand-font-mono);font-size:12.5px;color:var(--brand-muted);line-height:1.8}
/* @/c */

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:760px){body{font-size:18px}.verdict{padding:24px 22px}.grid2{grid-template-columns:1fr}.diff .row{grid-template-columns:1fr}.diff .note{border-left:0;border-top:1px solid var(--brand-line)}.weightrow{grid-template-columns:100px 1fr}.brandlogo{height:24px}.theme-toggle button{padding:6px 10px}}
</style>
</head>

<script>
/* Light / Dark / Auto. Defaults to Auto; remembers the last choice. */
(function(){
  var root=document.documentElement, KEY='fueled-report-theme';
  function paint(t){
    root.setAttribute('data-theme',t);
    var b=document.querySelectorAll('[data-theme-btn]');
    for(var i=0;i<b.length;i++){b[i].setAttribute('aria-pressed', String(b[i].getAttribute('data-theme-btn')===t));}
    try{localStorage.setItem(KEY,t);}catch(e){}
  }
  window.__setTheme=paint;
  var saved='auto'; try{saved=localStorage.getItem(KEY)||'auto';}catch(e){}
  paint(saved);
})();
</script>
